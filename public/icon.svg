<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="102" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Circuit Trace Accents -->
  <path d="M 64 160 L 140 160 L 170 190" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4"/>
  <circle cx="64" cy="160" r="8" fill="#38bdf8"/>
  <path d="M 64 352 L 140 352 L 170 322" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4"/>
  <circle cx="64" cy="352" r="8" fill="#38bdf8"/>
  <path d="M 448 160 L 372 160 L 342 190" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4"/>
  <circle cx="448" cy="160" r="8" fill="#fbbf24"/>
  <path d="M 448 352 L 372 352 L 342 322" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4"/>
  <circle cx="448" cy="352" r="8" fill="#fbbf24"/>

  <!-- Central Processor Die / Terminal Window -->
  <rect x="120" y="120" width="272" height="272" rx="36" fill="url(#chipGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Terminal Window Bar -->
  <rect x="120" y="120" width="272" height="52" rx="36" fill="#1e293b"/>
  <rect x="120" y="150" width="272" height="22" fill="#1e293b"/>
  
  <!-- Window Control Dots -->
  <circle cx="152" cy="146" r="7" fill="#ef4444"/>
  <circle cx="174" cy="146" r="7" fill="#f59e0b"/>
  <circle cx="196" cy="146" r="7" fill="#10b981"/>

  <!-- Serial / Prompt Icon: '>_' and Chip Pins -->
  <path d="M 168 220 L 220 260 L 168 300" fill="none" stroke="url(#cyanGlow)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="240" y1="300" x2="296" y2="300" stroke="url(#amberGlow)" stroke-width="18" stroke-linecap="round"/>

  <!-- Chip Pin Indicators -->
  <rect x="180" y="98" width="12" height="22" rx="4" fill="#64748b"/>
  <rect x="220" y="98" width="12" height="22" rx="4" fill="#64748b"/>
  <rect x="260" y="98" width="12" height="22" rx="4" fill="#0ea5e9"/>
  <rect x="300" y="98" width="12" height="22" rx="4" fill="#64748b"/>
  <rect x="340" y="98" width="12" height="22" rx="4" fill="#64748b"/>

  <rect x="180" y="392" width="12" height="22" rx="4" fill="#64748b"/>
  <rect x="220" y="392" width="12" height="22" rx="4" fill="#64748b"/>
  <rect x="260" y="392" width="12" height="22" rx="4" fill="#f59e0b"/>
  <rect x="300" y="392" width="12" height="22" rx="4" fill="#64748b"/>
  <rect x="340" y="392" width="12" height="22" rx="4" fill="#64748b"/>

  <!-- Status Indicator LED -->
  <circle cx="348" cy="220" r="10" fill="#34d399"/>
  <circle cx="348" cy="220" r="16" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.6"/>
</svg>
